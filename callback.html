<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Juntix - Conectando...</title>
    <link rel="icon" type="image/png" href="logo/logo_juntix.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdfa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 90%;
        }
        .logo { width: 60px; height: 60px; margin: 0 auto 20px; }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        h1 { font-size: 20px; color: #111827; margin-bottom: 8px; }
        .status { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #dc2626; font-size: 14px; display: none; }
        .error.show { display: block; }
        .success { color: #16a34a; font-size: 14px; display: none; }
        .success.show { display: block; }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #16a34a; }
        .btn-outline {
            background: transparent;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }
        .btn-outline:hover { background: #f9fafb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="logo/logo_juntix.png" alt="Juntix"></div>

        <!-- Loading state -->
        <div id="loading">
            <div class="spinner"></div>
            <h1>Conectando sua conta...</h1>
            <p class="status">Estamos autorizando sua conta do Facebook/Instagram. Aguarde...</p>
        </div>

        <!-- Success state -->
        <div id="success" style="display:none">
            <div style="font-size:48px;margin-bottom:12px">&#10003;</div>
            <h1>Conectado com sucesso!</h1>
            <p class="success show" id="successMsg"></p>
            <a class="btn" id="redirectBtn" href="#">Ir para o Dashboard</a>
        </div>

        <!-- Error state -->
        <div id="error-state" style="display:none">
            <div style="font-size:48px;margin-bottom:12px">&#9888;</div>
            <h1>Erro na conexao</h1>
            <p class="error show" id="errorMsg"></p>
            <a class="btn btn-outline" id="retryBtn" href="#">Tentar novamente</a>
        </div>

        <!-- Cancelled state -->
        <div id="cancelled" style="display:none">
            <div style="font-size:48px;margin-bottom:12px">&#8634;</div>
            <h1>Autorizacao cancelada</h1>
            <p class="status">Voce cancelou a autorizacao. Nenhuma conta foi conectada.</p>
            <a class="btn btn-outline" href="/painel-master/marketing?tab=integracoes">Voltar ao Dashboard</a>
        </div>
    </div>

    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const errorParam = params.get('error');
        const errorReason = params.get('error_reason');
        const state = params.get('state');

        // Determine dashboard URL based on environment
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const dashboardBase = isLocal ? 'http://localhost:5173' : '';
        const dashboardUrl = dashboardBase + '/painel-master/marketing?tab=integracoes';
        const apiBase = isLocal ? 'http://localhost:3000/api' : '/api';

        // Set redirect button URLs
        document.getElementById('redirectBtn').href = dashboardUrl;
        document.getElementById('retryBtn').href = dashboardUrl;

        // Handle user cancellation
        if (errorParam === 'access_denied' || errorReason === 'user_denied') {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('cancelled').style.display = 'block';
            return;
        }

        // Handle other Facebook errors
        if (errorParam) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('errorMsg').textContent =
                'Erro do Facebook: ' + (params.get('error_description') || errorParam);
            return;
        }

        // No code = direct access to page (shouldn't happen)
        if (!code) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('errorMsg').textContent =
                'Nenhum codigo de autorizacao recebido. Inicie o processo de conexao pelo Dashboard.';
            return;
        }

        // Exchange code for tokens via backend API
        var redirectUri = window.location.origin + '/callback';

        // Get auth token from localStorage (user must be logged in)
        var token = localStorage.getItem('token') || '';

        fetch(apiBase + '/marketing/integration/facebook-callback', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token ? 'Bearer ' + token : '',
            },
            body: JSON.stringify({ code: code, redirectUri: redirectUri }),
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
            document.getElementById('loading').style.display = 'none';

            if (data.success) {
                document.getElementById('success').style.display = 'block';
                document.getElementById('successMsg').textContent =
                    data.message || ('Conta conectada: ' + (data.pageName || ''));

                // Redirect to dashboard after 3 seconds
                document.getElementById('redirectBtn').href =
                    dashboardUrl + '&connected=1&page=' + encodeURIComponent(data.pageName || '');
                setTimeout(function() {
                    window.location.href = dashboardUrl + '&connected=1&page=' + encodeURIComponent(data.pageName || '');
                }, 3000);
            } else {
                document.getElementById('error-state').style.display = 'block';
                document.getElementById('errorMsg').textContent =
                    data.message || 'Erro ao conectar conta. Tente novamente.';
            }
        })
        .catch(function(err) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('errorMsg').textContent =
                'Erro de conexao com o servidor: ' + (err.message || 'Tente novamente.');
        });
    })();
    </script>

    <!-- Facebook SDK for JavaScript -->
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : '1490465612677168',
                cookie     : true,
                xfbml      : true,
                version    : 'v25.0'
            });
        };

        (function(d, s, id){
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) {return;}
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/pt_BR/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    </script>
</body>
</html>
